<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTANI SMM PANEL</title>
    <!-- Stable Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 15px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .auth-container {
            max-width: 420px;
            margin: 40px auto;
            width: 90%;
        }

        .auth-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .switch-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            background: var(--card-bg);
        }

        .balance-badge {
            background: #064e3b;
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid #059669;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: capitalize;
            font-size: 0.75rem;
        }

        .status-pending { background: #854d0e; color: #fef08a; }
        .status-completed { background: #065f46; color: #a7f3d0; }
        .status-failed { background: #991b1b; color: #fecaca; }

        .hidden { display: none !important; }
        .price-display {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- AUTH WRAPPER -->
    <div id="authSection" class="auth-container">
        <div class="auth-switch">
            <button type="button" class="switch-btn active" id="tabLoginBtn" onclick="showAuthTab('login')">Login</button>
            <button type="button" class="switch-btn" id="tabRegisterBtn" onclick="showAuthTab('register')">Sign Up (Register)</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginCard" class="card">
            <h2 style="margin-bottom: 15px; text-align: center;">Multani SMM Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="user@gmail.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Minimum 6 characters">
                </div>
                <button type="submit" class="btn" id="btnLogin">Login</button>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerCard" class="card hidden">
            <h2 style="margin-bottom: 15px; text-align: center;">Create SMM Account</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="M Nadeem">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="user@gmail.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="Minimum 6 characters">
                </div>
                <button type="submit" class="btn" id="btnRegister">Register Now</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <header class="navbar">
            <div style="font-weight: 700; font-size: 1.1rem;">MULTANI SMM</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="balance-badge" id="userBalance">$0.0000</span>
                <button class="switch-btn" onclick="handleLogout()" style="padding: 6px 12px; font-size: 0.85rem;">Logout</button>
            </div>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchNav('newOrderTab', this)">New Order</button>
                <button class="tab-btn" onclick="switchNav('orderHistoryTab', this)">Order History</button>
                <button class="tab-btn" onclick="switchNav('depositTab', this)">Add Funds</button>
            </div>

            <!-- TAB 1: ORDER -->
            <div id="newOrderTab" class="card tab-content">
                <h3>Place an Order</h3>
                <form onsubmit="handlePlaceOrder(event)">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="orderCategory" required onchange="onCategorySelect()">
                            <option value="">Select Category</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Service</label>
                        <select id="orderService" required disabled onchange="updatePrice()">
                            <option value="">Select Category First</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Target Link / Username</label>
                        <input type="text" id="orderLink" required placeholder="https://tiktok.com/@username/video/...">
                    </div>

                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="orderQuantity" required min="1" placeholder="e.g. 1000" oninput="updatePrice()">
                        <small id="serviceLimits" style="color: var(--text-muted); font-size: 0.8rem;"></small>
                    </div>

                    <div class="form-group">
                        <label>Total Price (USD)</label>
                        <div class="price-display" id="calculatedCharge">$0.0000</div>
                    </div>

                    <button type="submit" class="btn" id="btnPlaceOrder">Submit Order</button>
                </form>
            </div>

            <!-- TAB 2: HISTORY -->
            <div id="orderHistoryTab" class="card tab-content hidden">
                <h3>Your Orders</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Service</th>
                                <th>Link</th>
                                <th>Qty</th>
                                <th>Cost</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="orderHistoryBody">
                            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No orders yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 3: DEPOSITS -->
            <div id="depositTab" class="card tab-content hidden">
                <h3>Deposit Funds (Easypaisa / JazzCash)</h3>
                <div style="background: #0f172a; border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;">
                    <p style="font-weight: 600; margin-bottom: 5px; color: #38bdf8;">Manual Accounts:</p>
                    <p>• <strong>Easypaisa:</strong> 03186815926 (M Nadeem)</p>
                    <p>• <strong>JazzCash:</strong> 03017573729 (Muhammad Nadeem)</p>
                </div>

                <form onsubmit="handleDeposit(event)">
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="depositMethod" required>
                            <option value="Easypaisa">Easypaisa</option>
                            <option value="JazzCash">JazzCash</option>
                            <option value="Bank">Bank Transfer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Amount in USD ($)</label>
                        <input type="number" step="0.01" id="depositAmount" required placeholder="e.g. 5.00">
                    </div>

                    <div class="form-group">
                        <label>Transaction ID / TRX</label>
                        <input type="text" id="depositTrx" required placeholder="e.g. 98127391">
                    </div>

                    <div class="form-group">
                        <label>Sender Account / Number</label>
                        <input type="text" id="depositSender" required placeholder="03XXXXXXXXX">
                    </div>

                    <button type="submit" class="btn">Submit Deposit Proof</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ghenauyyuxoniedwzabk.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoZW5hdXl5dXhvbmllZHd6YWJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NzI5ODgsImV4cCI6MjEwOTQ0ODk4OH0.NC1bx-akp0haMXxOQs4zrGzpID9H855J4Kno35znLTQ";
        let supabaseClient = null;

        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        let currentUser = null;
        let allServices = [];

        function showAuthTab(tab) {
            const loginCard = document.getElementById("loginCard");
            const registerCard = document.getElementById("registerCard");
            const tabLoginBtn = document.getElementById("tabLoginBtn");
            const tabRegisterBtn = document.getElementById("tabRegisterBtn");

            if (tab === 'login') {
                loginCard.classList.remove("hidden");
                registerCard.classList.add("hidden");
                tabLoginBtn.classList.add("active");
                tabRegisterBtn.classList.remove("active");
            } else {
                loginCard.classList.add("hidden");
                registerCard.classList.remove("hidden");
                tabLoginBtn.classList.remove("active");
                tabRegisterBtn.classList.add("active");
            }
        }

        window.addEventListener("DOMContentLoaded", async () => {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                openDashboard();
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegister");
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const pass = document.getElementById("regPassword").value;

            btn.disabled = true;
            btn.innerText = "Registering...";

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: pass,
                options: { data: { full_name: name } }
            });

            btn.disabled = false;
            btn.innerText = "Register Now";

            if (error) {
                alert("Signup Failed: " + error.message);
                return;
            }

            if (data.session) {
                alert("Account ban gaya!");
                currentUser = data.user;
                openDashboard();
            } else {
                const { data: logData, error: logErr } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass
                });

                if (logErr) {
                    alert("Account create ho gaya! Login tab se login karein.");
                    showAuthTab('login');
                    document.getElementById("loginEmail").value = email;
                } else {
                    currentUser = logData.user;
                    openDashboard();
                }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLogin");
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPassword").value;

            btn.disabled = true;
            btn.innerText = "Logging in...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: pass
            });

            btn.disabled = false;
            btn.innerText = "Login";

            if (error) {
                alert("Login Failed: " + error.message);
                return;
            }

            currentUser = data.user;
            openDashboard();
        }

        function handleLogout() {
            supabaseClient.auth.signOut().then(() => {
                location.reload();
            });
        }

        function openDashboard() {
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            loadUserProfile();
            loadServices();
            loadOrders();
        }

        async function loadUserProfile() {
            const { data } = await supabaseClient
                .from("profiles")
                .select("balance")
                .eq("id", currentUser.id)
                .single();

            if (data) {
                document.getElementById("userBalance").innerText = `$${parseFloat(data.balance).toFixed(4)}`;
            }
        }

        async function loadServices() {
            const { data: cats } = await supabaseClient
                .from("categories")
                .select("*")
                .eq("is_active", true)
                .order("sort_order");

            const { data: srvs } = await supabaseClient
                .from("services")
                .select("*")
                .eq("is_active", true);

            allServices = srvs || [];

            const catSelect = document.getElementById("orderCategory");
            catSelect.innerHTML = '<option value="">Select Category</option>';
            if (cats) {
                cats.forEach(c => {
                    const opt = document.createElement("option");
                    opt.value = c.id;
                    opt.textContent = c.name;
                    catSelect.appendChild(opt);
                });
            }
        }

        function onCategorySelect() {
            const catId = document.getElementById("orderCategory").value;
            const srvSelect = document.getElementById("orderService");
            srvSelect.innerHTML = '<option value="">Select Service</option>';
            srvSelect.disabled = true;
            document.getElementById("serviceLimits").innerText = "";
            document.getElementById("calculatedCharge").innerText = "$0.0000";

            if (!catId) return;

            const list = allServices.filter(s => s.category_id === catId);
            list.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.id;
                opt.textContent = `${s.name} - $${parseFloat(s.rate_per_1k).toFixed(4)}/1k`;
                srvSelect.appendChild(opt);
            });
            srvSelect.disabled = false;
        }

        function updatePrice() {
            const sId = document.getElementById("orderService").value;
            const qty = parseInt(document.getElementById("orderQuantity").value) || 0;
            const item = allServices.find(s => s.id === sId);

            if (item) {
                document.getElementById("serviceLimits").innerText = `Min: ${item.min_quantity} | Max: ${item.max_quantity}`;
                const cost = (qty / 1000) * parseFloat(item.rate_per_1k);
                document.getElementById("calculatedCharge").innerText = `$${cost.toFixed(4)}`;
            } else {
                document.getElementById("calculatedCharge").innerText = "$0.0000";
            }
        }

        async function handlePlaceOrder(e) {
            e.preventDefault();
            const sId = document.getElementById("orderService").value;
            const link = document.getElementById("orderLink").value.trim();
            const qty = parseInt(document.getElementById("orderQuantity").value);
            const item = allServices.find(s => s.id === sId);

            if (!item) return alert("Select service.");
            if (qty < item.min_quantity || qty > item.max_quantity) {
                return alert(`Quantity must be between ${item.min_quantity} and ${item.max_quantity}`);
            }

            const total = (qty / 1000) * parseFloat(item.rate_per_1k);

            const { data, error } = await supabaseClient
                .from("orders")
                .insert({
                    user_id: currentUser.id,
                    service_id: sId,
                    target_link: link,
                    quantity: qty,
                    charge: total,
                    status: 'pending',
                    idempotency_key: `${currentUser.id}_${Date.now()}`
                })
                .select()
                .single();

            if (error) return alert(error.message);

            const { error: rpcErr } = await supabaseClient.rpc("process_order_deduction", {
                p_user_id: currentUser.id,
                p_order_id: data.id,
                p_charge: total
            });

            if (rpcErr) {
                await supabaseClient.from("orders").update({ status: 'failed' }).eq("id", data.id);
                return alert("Insufficient Balance or Error: " + rpcErr.message);
            }

            alert("Order Placed Successfully!");
            document.getElementById("orderLink").value = "";
            document.getElementById("orderQuantity").value = "";
            document.getElementById("calculatedCharge").innerText = "$0.0000";
            loadUserProfile();
            loadOrders();
        }

        async function loadOrders() {
            const tbody = document.getElementById("orderHistoryBody");
            const { data } = await supabaseClient
                .from("orders")
                .select("*, services(name)")
                .eq("user_id", currentUser.id)
                .order("created_at", { ascending: false });

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No orders yet.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(o => `
                <tr>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>${o.services ? o.services.name : 'Service'}</td>
                    <td><a href="${o.target_link}" target="_blank" style="color: #38bdf8;">Link</a></td>
                    <td>${o.quantity}</td>
                    <td>$${parseFloat(o.charge).toFixed(4)}</td>
                    <td><span class="status-badge status-${o.status}">${o.status}</span></td>
                </tr>
            `).join("");
        }

        async function handleDeposit(e) {
            e.preventDefault();
            const method = document.getElementById("depositMethod").value;
            const amt = parseFloat(document.getElementById("depositAmount").value);
            const trx = document.getElementById("depositTrx").value.trim();
            const sender = document.getElementById("depositSender").value.trim();

            const { error } = await supabaseClient
                .from("deposits")
                .insert({
                    user_id: currentUser.id,
                    payment_method: method,
                    amount: amt,
                    transaction_id: trx,
                    sender_account: sender,
                    status: 'pending'
                });

            if (error) return alert("Deposit error: " + error.message);

            alert("Deposit request submitted successfully! Admin will approve soon.");
            e.target.reset();
        }

        function switchNav(id, btn) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll(".nav-tabs .tab-btn").forEach(el => el.classList.remove("active"));
            document.getElementById(id).classList.remove("hidden");
            btn.classList.add("active");
            if (id === 'orderHistoryTab') loadOrders();
        }
    </script>
</body>
</html>
