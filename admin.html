<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTANI SMM PANEL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --bg-base: #06070A;
            --bg-card: #0E1118;
            --bg-card-sec: #151C29;
            --accent-orange: #FF4624;
            --accent-cyan: #00D5FF;
            --accent-green: #10B981;
            --text-main: #FFFFFF;
            --text-muted: #9BA8BC;
            --border-card: #1f293d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; width: 100%; padding-bottom: 70px; }
        h1, h2, h3, h4, .brand-font { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }

        /* SCROLLING ANNOUNCEMENT TICKER */
        .announcement-bar {
            background: linear-gradient(90deg, #151C29, #1f293d);
            border-bottom: 1px solid var(--accent-orange);
            color: #fff;
            padding: 6px 10px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1001;
        }
        .announcement-badge {
            background: var(--accent-orange);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.65rem;
            margin-right: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .announcement-ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 22s linear infinite;
            font-weight: 500;
            color: var(--accent-cyan);
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Top Navbar */
        .top-navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-card);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 33px;
            z-index: 999;
        }
        .balance-badge {
            background: var(--bg-card-sec);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }
        .currency-select {
            background: var(--bg-card-sec);
            border: 1px solid var(--border-card);
            color: #fff;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 0.72rem;
            font-weight: 700;
            outline: none;
        }

        /* Views Layout */
        .app-view { display: none; padding: 15px; max-width: 600px; width: 100%; margin: 0 auto; }
        .app-view.active { display: block; }
        .vip-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 14px; padding: 18px; margin-bottom: 15px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 10px 12px; background: var(--bg-card-sec); border: 1px solid var(--border-card); border-radius: 8px; color: var(--text-main); font-size: 0.88rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan); }

        .btn-vip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 11px; background: linear-gradient(135deg, var(--accent-orange), #d93314); color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; cursor: pointer; }

        /* Bottom Nav */
        .mobile-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(14, 17, 24, 0.98); backdrop-filter: blur(12px); border-top: 1px solid var(--border-card); z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .mobile-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-muted); font-size: 0.65rem; font-weight: 600; cursor: pointer; }
        .mobile-nav-item i { font-size: 1.15rem; }
        .mobile-nav-item.active { color: var(--accent-orange); }

        #toastContainer { position: fixed; top: 40px; right: 15px; left: 15px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { padding: 12px 16px; background: rgba(14, 17, 24, 0.96); border-left: 4px solid var(--accent-cyan); border-radius: 8px; color: #fff; font-size: 0.85rem; border: 1px solid var(--border-card); pointer-events: auto; }
        .toast.error { border-left-color: var(--accent-orange); }
        .toast.success { border-left-color: var(--accent-green); }
        
        .chat-box { background: var(--bg-card-sec); border-radius: 10px; height: 350px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .bubble-admin { align-self: flex-start; background: #1f293d; color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 0.82rem; max-width: 80%; }
        .bubble-user { align-self: flex-end; background: var(--accent-orange); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 0.82rem; max-width: 80%; }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <!-- 1. SCROLLING ANNOUNCEMENT TICKER -->
    <div class="announcement-bar">
        <div class="announcement-badge"><i class="fa-solid fa-bullhorn"></i> NOTICE</div>
        <div class="announcement-ticker" id="scrollingAnnouncementText">
            Welcome to MULTANI SMM PANEL! All services active with instant speed.
        </div>
    </div>

    <!-- 2. TOP NAVBAR -->
    <header class="top-navbar">
        <div class="balance-badge">
            <i class="fa-solid fa-wallet"></i>
            <span id="headerBalanceDisplay">Rs 0.00</span>
        </div>
        
        <!-- Multi-Currency Switcher -->
        <select class="currency-select" id="currencySelect" onchange="handleCurrencyChange(this.value)">
            <option value="PKR">🇵🇰 PKR (Rs)</option>
            <option value="USD">🇺🇸 USD ($)</option>
            <option value="INR">🇮🇳 INR (₹)</option>
            <option value="AED">🇦🇪 AED</option>
            <option value="SAR">🇸🇦 SAR</option>
        </select>
    </header>

    <!-- VIEW 1: NEW ORDER -->
    <div id="viewOrder" class="app-view active">
        <div class="vip-card">
            <h2 style="margin-bottom: 14px; font-size: 1.15rem; color: var(--accent-cyan);"><i class="fa-solid fa-bolt"></i> Place Order</h2>
            <form onsubmit="handlePlaceOrder(event)">
                <div class="form-group">
                    <label>Category</label>
                    <select id="orderCatSelect" onchange="handleCategoryFilter(this.value)" required>
                        <option value="">Select Category</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Service</label>
                    <select id="orderServiceSelect" onchange="handleServiceSelect(this.value)" required>
                        <option value="">Select Service</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Link / Username</label>
                    <input type="text" id="orderTargetLink" required placeholder="https://tiktok.com/@username/video/...">
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="orderQuantity" required oninput="calculateTotalCharge()" placeholder="1000">
                    <small id="qtyLimitHint" style="color: var(--text-muted); font-size: 0.7rem;"></small>
                </div>
                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Total Price:</span>
                    <span style="font-size: 1.15rem; font-weight: 700; color: var(--accent-orange); font-family: 'Rajdhani';" id="orderTotalDisplay">Rs 0.00</span>
                </div>
                <button type="submit" class="btn-vip" id="btnPlaceOrder"><i class="fa-solid fa-cart-shopping"></i> Confirm Order</button>
            </form>
        </div>
    </div>

    <!-- VIEW 2: ORDERS HISTORY -->
    <div id="viewOrdersList" class="app-view">
        <div class="vip-card">
            <h2 style="margin-bottom: 12px; font-size: 1.15rem;"><i class="fa-solid fa-boxes-stacked"></i> My Orders</h2>
            <div id="customerOrdersList" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">Loading orders...</p>
            </div>
        </div>
    </div>

    <!-- VIEW 3: LIVE SUPPORT CHAT -->
    <div id="viewSupport" class="app-view">
        <div class="vip-card">
            <h2 style="margin-bottom: 10px; font-size: 1.15rem; color: var(--accent-orange);"><i class="fa-solid fa-headset"></i> Live Support</h2>
            <div class="chat-box" id="customerChatWindow">
                <div class="bubble-admin">Hello! Need help with your order or deposit? Send a message here.</div>
            </div>
            <form style="display: flex; gap: 6px;" onsubmit="handleSendCustomerChat(event)">
                <input type="text" id="customerChatInput" placeholder="Type message..." required>
                <button type="submit" class="btn-vip" style="width: auto; padding: 0 16px;"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="mobile-bottom-nav">
        <div class="mobile-nav-item active" onclick="switchCustomerTab('viewOrder', this)">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Order</span>
        </div>
        <div class="mobile-nav-item" onclick="switchCustomerTab('viewOrdersList', this)">
            <i class="fa-solid fa-list-check"></i>
            <span>History</span>
        </div>
        <div class="mobile-nav-item" onclick="switchCustomerTab('viewSupport', this)">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://ghenauyyuxoniedwzabk.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoZW5hdXl5dXhvbmllZHd6YWJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NzI5ODgsImV4cCI6MjEwOTQ0ODk4OH0.NC1bx-akp0haMXxOQs4zrGzpID9H855J4Kno35znLTQ";
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        let currentUser = null;
        let currentUserProfile = null;
        let allServices = [];
        let selectedService = null;

        // MULTI-CURRENCY CONVERSION SYSTEM (Binance Rate: 1$ = 290 PKR)
        const CURRENCIES = {
            PKR: { symbol: "Rs ", rate: 290.00 },
            USD: { symbol: "$", rate: 1.00 },
            INR: { symbol: "₹", rate: 94.35 },
            AED: { symbol: "AED ", rate: 3.67 },
            SAR: { symbol: "SAR ", rate: 3.75 }
        };
        let activeCurrency = localStorage.getItem("app_currency") || "PKR";

        function formatPrice(amountInUSD) {
            const c = CURRENCIES[activeCurrency] || CURRENCIES.PKR;
            const converted = amountInUSD * c.rate;
            return `${c.symbol}${converted.toFixed(2)}`;
        }

        function handleCurrencyChange(curr) {
            activeCurrency = curr;
            localStorage.setItem("app_currency", curr);
            updateWalletDisplay();
            renderServiceDropdown(document.getElementById("orderCatSelect").value);
            calculateTotalCharge();
        }

        function notify(msg, type = "info") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.addEventListener("DOMContentLoaded", async () => {
            document.getElementById("currencySelect").value = activeCurrency;
            await loadSiteAnnouncement();
            
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await loadUserProfile();
                loadCustomerOrders();
                loadCustomerChat();
            }
            await loadServicesAndCategories();
        });

        // 1. LOAD LIVE ANNOUNCEMENT FROM SUPABASE
        async function loadSiteAnnouncement() {
            const { data } = await supabaseClient
                .from("site_settings")
                .select("value")
                .eq("key", "announcement")
                .single();

            if (data && data.value) {
                document.getElementById("scrollingAnnouncementText").innerText = data.value;
            }
        }

        // 2. LOAD PROFILE & BALANCE
        async function loadUserProfile() {
            const { data } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
            if (data) {
                currentUserProfile = data;
                updateWalletDisplay();
            }
        }

        function updateWalletDisplay() {
            if (!currentUserProfile) return;
            const balUSD = parseFloat(currentUserProfile.balance || 0);
            document.getElementById("headerBalanceDisplay").innerText = formatPrice(balUSD);
        }

        // 3. LOAD SERVICES & CATEGORIES (WITH MULTI-CURRENCY DISPLAY)
        async function loadServicesAndCategories() {
            const { data: cats } = await supabaseClient.from("categories").select("*").order("name");
            const { data: srvs } = await supabaseClient.from("services").select("*").eq("is_active", true);

            allServices = srvs || [];

            const catSelect = document.getElementById("orderCatSelect");
            catSelect.innerHTML = '<option value="">Select Category</option>';
            if (cats) {
                cats.forEach(c => catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);
            }
        }

        function handleCategoryFilter(catId) {
            renderServiceDropdown(catId);
        }

        function renderServiceDropdown(catId) {
            const srvSelect = document.getElementById("orderServiceSelect");
            srvSelect.innerHTML = '<option value="">Select Service</option>';
            if (!catId) return;

            const filtered = allServices.filter(s => s.category_id === catId);
            filtered.forEach(s => {
                const priceFormatted = formatPrice(parseFloat(s.rate_per_1k));
                srvSelect.innerHTML += `<option value="${s.id}">${s.name} - (${priceFormatted}/1k)</option>`;
            });
        }

        function handleServiceSelect(srvId) {
            selectedService = allServices.find(s => s.id === srvId) || null;
            if (selectedService) {
                document.getElementById("qtyLimitHint").innerText = `Min: ${selectedService.min_quantity} | Max: ${selectedService.max_quantity}`;
            }
            calculateTotalCharge();
        }

        function calculateTotalCharge() {
            const qty = parseInt(document.getElementById("orderQuantity").value) || 0;
            if (!selectedService || qty <= 0) {
                document.getElementById("orderTotalDisplay").innerText = formatPrice(0);
                return;
            }
            const chargeUSD = (qty / 1000) * parseFloat(selectedService.rate_per_1k);
            document.getElementById("orderTotalDisplay").innerText = formatPrice(chargeUSD);
        }

        async function handlePlaceOrder(e) {
            e.preventDefault();
            if (!currentUser) return notify("Please login first!", "error");
            if (!selectedService) return notify("Select a service first!", "error");

            const qty = parseInt(document.getElementById("orderQuantity").value);
            if (qty < selectedService.min_quantity || qty > selectedService.max_quantity) {
                return notify(`Quantity must be between ${selectedService.min_quantity} and ${selectedService.max_quantity}`, "error");
            }

            const chargeUSD = (qty / 1000) * parseFloat(selectedService.rate_per_1k);
            if (parseFloat(currentUserProfile.balance) < chargeUSD) {
                return notify("Insufficient wallet balance. Please deposit funds.", "error");
            }

            const link = document.getElementById("orderTargetLink").value.trim();
            const btn = document.getElementById("btnPlaceOrder");
            btn.disabled = true;
            btn.innerText = "Processing...";

            const { data, error } = await supabaseClient.from("orders").insert({
                user_id: currentUser.id,
                service_id: selectedService.id,
                target_link: link,
                quantity: qty,
                charge: chargeUSD,
                status: 'pending'
            }).select();

            btn.disabled = false;
            btn.innerText = "Confirm Order";

            if (error) return notify("Order failed: " + error.message, "error");

            // Deduct balance
            await supabaseClient.from("profiles").update({
                balance: parseFloat(currentUserProfile.balance) - chargeUSD
            }).eq("id", currentUser.id);

            notify("Order placed successfully!", "success");
            document.getElementById("orderTargetLink").value = "";
            document.getElementById("orderQuantity").value = "";
            loadUserProfile();
            loadCustomerOrders();
        }

        // 4. CUSTOMER ORDERS
        async function loadCustomerOrders() {
            if (!currentUser) return;
            const { data } = await supabaseClient.from("orders").select("*, services(name)").eq("user_id", currentUser.id).order("created_at", { ascending: false });
            const list = document.getElementById("customerOrdersList");
            if (!data || data.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">No orders placed yet.</p>`;
                return;
            }

            list.innerHTML = data.map(o => `
                <div style="background: var(--bg-card-sec); border: 1px solid var(--border-card); border-radius: 8px; padding: 10px;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px;">
                        <strong style="color: var(--accent-cyan);">#${o.order_number || o.id.substring(0,5)}</strong>
                        <span style="color: ${o.status==='completed'?'#10B981':'#EAB308'}; font-weight:700;">${o.status.toUpperCase()}</span>
                    </div>
                    <div style="font-size: 0.78rem;">${o.services ? o.services.name : 'Service'}</div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">
                        <span>Qty: ${o.quantity}</span>
                        <strong style="color: #fff;">${formatPrice(parseFloat(o.charge))}</strong>
                    </div>
                </div>
            `).join("");
        }

        // 5. CHAT
        async function loadCustomerChat() {
            if (!currentUser) return;
            const { data } = await supabaseClient.from("chat_messages").select("*").eq("user_id", currentUser.id).order("created_at", { ascending: true });
            const body = document.getElementById("customerChatWindow");
            if (data && data.length > 0) {
                body.innerHTML = data.map(m => `
                    <div class="${m.sender_type==='admin'?'bubble-admin':'bubble-user'}">${m.message}</div>
                `).join("");
                body.scrollTop = body.scrollHeight;
            }
        }

        async function handleSendCustomerChat(e) {
            e.preventDefault();
            if (!currentUser) return notify("Please login first!", "error");
            const input = document.getElementById("customerChatInput");
            const msg = input.value.trim();
            if (!msg) return;

            input.value = "";
            await supabaseClient.from("chat_messages").insert({ user_id: currentUser.id, sender_type: 'user', message: msg });
            loadCustomerChat();
        }

        function switchCustomerTab(viewId, element) {
            document.querySelectorAll(".app-view").forEach(v => v.classList.remove("active"));
            document.querySelectorAll(".mobile-nav-item").forEach(i => i.classList.remove("active"));
            document.getElementById(viewId).classList.add("active");
            if (element) element.classList.add("active");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
